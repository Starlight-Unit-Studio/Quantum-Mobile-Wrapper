name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Lint API compatibility, test and build debug APK
        run: gradle lintDebug test assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: starlight-unit-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-6-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: starlight-unit-android-debug
          path: apk

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android 6 emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-23;google_apis;x86_64"
          echo no | avdmanager create avd \
            --force \
            --name qmw_api23 \
            --package "system-images;android-23;google_apis;x86_64"

      - name: Boot Android 6 emulator and smoke-test wrapper startup
        run: |
          emulator -avd qmw_api23 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/qmw-api23-emulator.log" 2>&1 &

          adb wait-for-device
          timeout 300 bash -c '
            until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do
              sleep 5
            done
          '

          adb shell input keyevent 82 || true
          adb install -r apk/app-debug.apk
          adb logcat -c

          adb shell am start -W \
            -n de.starlightunit.game.debug/de.starlightunit.wrapper.MainActivity \
            | tee "$RUNNER_TEMP/qmw-api23-start.txt"

          sleep 8

          if ! adb shell ps | grep -q 'de.starlightunit.game.debug'; then
            echo 'Quantum Mobile Wrapper process did not survive API 23 cold start.' >&2
            adb logcat -d -v time || true
            cat "$RUNNER_TEMP/qmw-api23-emulator.log" || true
            exit 1
          fi

          if adb logcat -d -v brief | grep -A 8 -B 3 \
            'Process: de.starlightunit.game.debug' \
            | grep -q 'FATAL EXCEPTION'; then
            echo 'Fatal Java exception detected during API 23 startup.' >&2
            adb logcat -d -v time || true
            exit 1
          fi

          echo 'Android 6 / API 23 cold-start smoke test passed.'
