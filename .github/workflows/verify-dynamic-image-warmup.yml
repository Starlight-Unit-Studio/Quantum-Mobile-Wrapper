name: Verify dynamic image warmup

on:
  push:
    branches:
      - fix/dynamic-image-asset-warmup

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report canonical splash fingerprint
        run: |
          splash="app/src/main/res/drawable-nodpi/quantum_production_splash.jpg"
          test -f "$splash"
          stat -c 'SPLASH_SIZE=%s' "$splash"
          sha256sum "$splash"
          file "$splash"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Lint API compatibility, test and build debug APK
        run: gradle lintDebug test assembleDebug --stacktrace
